[package]
name = "mitm-test-server"
version = "0.7.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["form"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
toml = "1.1.8"
